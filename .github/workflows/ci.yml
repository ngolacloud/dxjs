name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install (workspace links + happy-dom for DOM tests)
        run: npm install
      # The one gate: no-eval + jsx-types + unit tests (native TS via the
      # `development` export condition) + size budgets. Mirrors `npm run check`
      # exactly so CI and local never drift.
      - name: check (no-eval + jsx-types + 201 tests + size)
        run: npm run check
      - name: build (esbuild → dist + .d.ts for all packages + demo bundles)
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: strict-CSP browser proofs (render + canvas + charts + vanilla + live SSE + dashboard)
        run: node scripts/build.mjs && node --test e2e/csp/csp.test.mjs e2e/csp/canvas.test.mjs e2e/csp/chart.test.mjs e2e/csp/vanilla.test.mjs e2e/csp/live.test.mjs e2e/csp/dash.test.mjs
      - name: HMR dev-server proof (signal survives an edit under strict CSP)
        run: npm run test:hmr
      - name: cloud-shell proof (Track D stack composed, under strict CSP)
        run: npm run test:shell
      - name: docs site proof (dogfooded dxjs app under strict CSP)
        run: node docs/build.mjs && node --test docs/test/docs.test.mjs
      - name: delonix-dx-console proof-of-concept (dashboard + containers under strict CSP)
        run: node examples/delonix-dx-console/build.mjs && node --test examples/delonix-dx-console/test/console.test.mjs
