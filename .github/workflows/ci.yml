name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install (workspace links + happy-dom for DOM tests)
        run: npm install
      - name: no-eval gate (CSP safety)
        run: node scripts/no-eval-gate.mjs
      - name: unit tests (node:test, native TS)
        run: node --test packages/*/test/*.test.ts examples/*/test/*.test.ts
      - name: size budget gate (real esbuild min+gzip)
        run: node scripts/size.mjs
      - name: build (esbuild → dist + demo bundle)
        run: node scripts/build.mjs

  csp-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: strict-CSP browser proofs (render + canvas + charts + vanilla + live SSE)
        run: node scripts/build.mjs && node --test e2e/csp/csp.test.mjs e2e/csp/canvas.test.mjs e2e/csp/chart.test.mjs e2e/csp/vanilla.test.mjs e2e/csp/live.test.mjs e2e/csp/dash.test.mjs
      - name: docs site proof (dogfooded dxjs app under strict CSP)
        run: node docs/build.mjs && node --test docs/test/docs.test.mjs
      - name: delonix-dx-console proof-of-concept (dashboard + containers under strict CSP)
        run: node examples/delonix-dx-console/build.mjs && node --test examples/delonix-dx-console/test/console.test.mjs
