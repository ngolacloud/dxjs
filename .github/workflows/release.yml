name: release

# Publishes every @dxjs/* package to npm when a v* tag is pushed. The private
# root package (private: true) is skipped by npm automatically. Gate + build run
# first, so a tag never publishes a red tree.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: install
        run: npm install
      - name: check (no-eval + jsx-types + tests + size)
        run: npm run check
      - name: build (dist/index.js + dist/index.d.ts for every package)
        run: npm run build
      # Publish all workspaces (packages/*). Public scope for @dxjs/*; provenance
      # ties the artifact to this workflow+commit. Requires an NPM_TOKEN secret
      # with publish rights to the @dxjs org.
      - name: publish @dxjs/* to npm
        run: npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
